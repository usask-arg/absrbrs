[project]
name = "absrbrs-validation"
version = "0.1.0"
description = "Accuracy of absrbrs against Arb references computed at run time, and against HAPI"
requires-python = ">=3.11"
# python-flint is pinned exactly, as in reference/; hitran-api too (its embedded TIPS-2021 tables
# are the cross-check of tests/test_tips.py).
dependencies = ["absrbrs", "hitran-api==1.3.0.0", "numpy>=2.0", "python-flint==0.9.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
absrbrs = { path = "..", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
