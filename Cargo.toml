[workspace]
members = ["absrbrs"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/usask-arg/absrbrs"

[workspace.dependencies]
thiserror = "2"

[profile.release]
lto = "fat"
codegen-units = 1

# Reference-data tests are slow without optimisation; keep debug assertions on.
[profile.test]
opt-level = 2
