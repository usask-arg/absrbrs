[workspace]
members = ["absrbrs", "absrbrs-py"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/usask-arg/absrbrs"

[workspace.dependencies]
num-complex = "0.4.6"
thiserror = "2"
# float_roundtrip makes f64 parsing correctly rounded; without it, values can be 1 ulp off.
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = "fat"
codegen-units = 1

# Reference-data tests are slow without optimisation; keep debug assertions on.
[profile.test]
opt-level = 2
