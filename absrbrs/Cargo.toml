[package]
name = "absrbrs"
description = "Molecular absorption cross sections with first-class linearization"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["spectroscopy", "absorption", "hitran", "voigt", "atmosphere"]
categories = ["science", "mathematics"]
# The integration tests read the Arb reference data in ../reference/data, which is outside the
# package, so they are not published. (LICENSE is a copy of the repository's, for the package.)
exclude = ["/tests/", "*.proptest-regressions"]

[dependencies]
num-complex.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }

[[bench]]
name = "faddeeva"
harness = false
