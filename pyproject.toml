[build-system]
# 1.9.4 is the first maturin that reads license-files and writes a PEP 639 License-Expression.
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "absrbrs"
dynamic = ["version"]
description = "Molecular absorption cross sections with first-class linearization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "absrbrs/LICENSES/Faddeeva-MIT.txt", "absrbrs/LICENSES/HAPI-MIT.txt"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
xarray = ["xarray>=2024.7"]
test = ["pytest>=8", "packaging>=24"]
docs = [
    "sphinx>=9",
    "furo>=2024.8",
    "myst-nb>=1.1",
    "numpydoc>=1.8",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]

[project.urls]
Documentation = "https://usask-arg.github.io/absrbrs/"
Repository = "https://github.com/usask-arg/absrbrs"

[dependency-groups]
dev = ["maturin>=1.9.4,<2.0", "pytest>=8", "mypy>=1.13", "ruff>=0.8", "pre-commit>=4"]

[tool.uv]
# uv rebuilds the (editable, release-profile) install only when a cache key changes; listing
# the Rust sources means `uv run pytest` never tests a stale extension.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = ".cargo/config.toml" },
    { file = "absrbrs/Cargo.toml" },
    { file = "absrbrs/src/**/*.rs" },
    { file = "absrbrs-py/Cargo.toml" },
    { file = "absrbrs-py/build.rs" },
    { file = "absrbrs-py/src/**/*.rs" },
]

[tool.maturin]
manifest-path = "absrbrs-py/Cargo.toml"
python-source = "python"
module-name = "absrbrs._absrbrs"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# First-party packages: absrbrs (python/), the reference generator (reference/), the
# Faddeeva prototype (prototypes/faddeeva/) and the accuracy validation (validation/).
src = ["python", "reference", "prototypes/faddeeva", "validation", "."]
# The design records keep the plan's code blocks verbatim; ruff would reformat them.
extend-exclude = ["docs/plans", "docs/specs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]
# Deliberate typography in docstrings and comments: minus sign, en dash, multiplication sign,
# prime (w′), and the Greek letters of the spectroscopy notation.
allowed-confusables = ["−", "–", "×", "′", "α", "γ", "ν", "σ", "ρ"]
