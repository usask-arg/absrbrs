name: Scheduled checks

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Unit tests that read reference/data skip without it (as in the published crate);
  # here a missing file is an error.
  ABSRBRS_REQUIRE_REFERENCE_DATA: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to commit SHAs; Dependabot updates them.
jobs:
  reference-drift:
    name: Regenerate the Arb reference data and check for drift (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Regenerate every reference file
        run: uv run --locked --directory reference python -m absrbrs_reference generate
      - name: Fail on any difference from the committed data
        run: |
          changes=$(git status --porcelain --untracked-files=all -- reference/data)
          if [ -n "$changes" ]; then
            echo "::error::The regenerated reference data differ from the committed files."
            echo "$changes"
            git diff --stat -- reference/data
            exit 1
          fi
      - name: Keep the regenerated data for inspection
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regenerated-reference-data-${{ matrix.os }}
          path: reference/data

  intel-macos:
    name: Rust tests (Intel macOS)
    # Not run per change, to keep its cost down; Apple's x86_64 libm is the least accurate that
    # the sibling project scatrs has met.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Run the tests
        run: cargo test --workspace --locked -- --nocapture
